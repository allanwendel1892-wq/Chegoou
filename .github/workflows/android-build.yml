name: Build Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install @capacitor/assets --save-dev

      - name: Create Capacitor Config
        run: |
          echo '{
            "appId": "com.chegoou.app",
            "appName": "Chegoou Delivery",
            "webDir": "www",
            "server": {
              "url": "https://chegoou.vercel.app",
              "androidScheme": "https"
            }
          }' > capacitor.config.json

      - name: Create dummy www
        run: mkdir -p www && echo "Carregando..." > www/index.html

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      # --- GERA ÍCONES SE O ARQUIVO EXISTIR ---
      - name: Generate Icons & Splash
        run: |
          if [ -f "icon.png" ]; then
            echo "✅ Arquivo icon.png encontrado! Gerando ícones..."
            mkdir -p assets
            cp icon.png assets/icon.png
            cp icon.png assets/splash.png
            npx @capacitor/assets generate --android
          else
            echo "⚠️ Arquivo icon.png NÃO encontrado. Usando ícone padrão."
          fi

      # 5. ATUALIZADO: Força Gradle 8.9 (Correção do Erro)
      - name: Force Gradle Upgrade to 8.9
        run: |
          cd android/gradle/wrapper
          sed -i 's/distributionUrl=.*gradle-.*-all.zip/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-8.9-all.zip/g' gradle-wrapper.properties

      - name: Fix Kotlin Duplicates
        run: |
          cd android
          echo "" >> build.gradle
          echo "allprojects {" >> build.gradle
          echo "    configurations.all {" >> build.gradle
          echo "        resolutionStrategy {" >> build.gradle
            echo "            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'" >> build.gradle
            echo "            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'" >> build.gradle
            echo "            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'" >> build.gradle
          echo "        }" >> build.gradle
          echo "    }" >> build.gradle
          echo "}" >> build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chegoou-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
