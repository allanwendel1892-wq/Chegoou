name: Build Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor Config
        run: |
          echo '{
            "appId": "com.chegoou.app",
            "appName": "Chegoou Delivery",
            "webDir": "www",
            "server": {
              "url": "https://chegoou.vercel.app",
              "androidScheme": "https"
            }
          }' > capacitor.config.json

      - name: Create dummy www
        run: mkdir -p www && echo "Carregando..." > www/index.html

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      # --- O PULO DO GATO ---
      # Aqui trocamos a versão 8.2.1 pela 8.7 diretamente no arquivo de configuração
      # antes mesmo do Gradle tentar rodar. Isso evita o crash.
      - name: Force Gradle Upgrade to 8.7
        run: |
          cd android/gradle/wrapper
          sed -i 's/8.2.1/8.7/g' gradle-wrapper.properties

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chegoou-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
